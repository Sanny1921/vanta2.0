  <!-- GitHub Pages SPA redirect restoration (works with 404.html) -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <title>Vanta - The Meeting Point</title>
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('vanta_theme') || 'light');
          document.documentElement.setAttribute('data-accent', localStorage.getItem('vanta_accent') || 'emerald');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
